<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b32"><title>HSE — VGP & Risque chimique</title>
<style>
:root{--nav:#173b32;--nav2:#245747;--bg:#f3f6f5;--card:#fff;--ink:#182824;--muted:#667873;--line:#dce5e1;--accent:#25815e;--warn:#c27b14;--red:#b83b3b;--blue:#356bb3;--radius:14px}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:var(--nav);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:21px;font-weight:800;padding:8px 12px 22px}.brand small{display:block;font-size:11px;font-weight:500;opacity:.7;letter-spacing:1.5px;margin-top:4px}.navbtn{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;color:#dce9e3;padding:12px;border-radius:10px;text-align:left;margin:3px 0}.navbtn:hover,.navbtn.active{background:#ffffff20;color:#fff}.ico{width:24px;text-align:center;font-size:18px}.sidefoot{font-size:11px;color:#bad0c6;margin:20px 12px}.main{min-width:0}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.topbar strong{font-size:18px}.content{padding:26px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:22px}.pagehead h1{margin:0;font-size:27px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.two{grid-template-columns:1.2fr .8fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:19px;min-width:0;box-shadow:0 2px 8px #18392b05}.stat-label{color:var(--muted);font-size:13px}.stat-value{font-size:30px;font-weight:800;margin:8px 0 3px}.stat-foot{font-size:12px;color:var(--muted)}h2{font-size:18px;margin:0 0 15px}h3{font-size:15px;margin:0 0 10px}.pill{display:inline-block;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:700;background:#eaf2ee;color:#27644d;white-space:nowrap}.pill.red{background:#fde9e7;color:#a12e2a}.pill.orange{background:#fff1d9;color:#88540a}.pill.blue{background:#e8f0fc;color:#2d5d9a}.pill.gray{background:#edf0ef;color:#56645f}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f7faf8;color:#60716b;font-size:11px;text-transform:uppercase;letter-spacing:.5px}tr:last-child td{border-bottom:0}.empty{text-align:center;padding:35px;color:var(--muted)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{max-width:280px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;color:var(--ink);font-weight:650}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--red)}.btn.sm{font-size:12px;padding:6px 9px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:700;color:#52645d}.field input,.field select,.field textarea{border:1px solid #ccd8d2;border-radius:9px;padding:10px;background:#fff;color:var(--ink);width:100%}.field textarea{min-height:90px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.span2{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px;flex-wrap:wrap}.notice{padding:12px 14px;border-radius:10px;background:#fff5df;color:#765016;font-size:13px;margin-bottom:15px}.notice.green{background:#e8f4ed;color:#235d43}.module-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.module-card{cursor:pointer}.module-icon{font-size:28px;margin-bottom:10px}.module-card p{font-size:13px;color:var(--muted)}.overlay{position:fixed;inset:0;background:#0b211bb0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}.modal{background:#fff;border-radius:16px;width:min(980px,100%);max-height:94vh;overflow:auto;padding:24px;box-shadow:0 20px 80px #0003}.modalhead{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.modalhead h2{margin:0}.x{border:0;background:#eef2ef;border-radius:50%;width:34px;height:34px;font-size:20px}.hidden{display:none!important}.stack{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.checkrow{display:flex;align-items:center;gap:8px}.checkrow input{width:auto}.action-overdue{color:var(--red);font-weight:800}.drop{border:2px dashed #b9ccc4;border-radius:14px;padding:30px;text-align:center;background:#f9fbfa}.drop input{display:none}.drop label{display:inline-block}.progress{height:10px;background:#e9efec;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:var(--accent);transition:.2s}.ai-status{padding:12px;border-radius:10px;background:#f7faf8;border:1px solid var(--line);margin-top:12px}.ai-status.busy{background:#fff8e6;color:#765016}.ai-status.ok{background:#e8f4ed;color:#235d43}.ai-status.err{background:#fde9e7;color:#8c2925}.ob-card{border:1px solid var(--line);border-radius:12px;padding:13px;margin:9px 0;background:#fff}.ob-card .ob-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.ob-title{font-weight:800}.ob-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.ob-box{background:#f8faf9;border:1px solid var(--line);border-radius:9px;padding:8px}.ob-box b{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px}.settings-note{font-size:12px;color:var(--muted);line-height:1.5}.chemical-summary{grid-template-columns:repeat(4,minmax(0,1fr))}.status-ok{color:#2b6f55;font-weight:800}.status-soon{color:#9a6410;font-weight:800}.status-late{color:var(--red);font-weight:800}.status-missing{color:#88540a;font-weight:800}.hazards{display:flex;flex-wrap:wrap;gap:4px}.hazard{background:#eef4ff;color:#315d9a;border:1px solid #cddcf4;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:700}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:900px){.shell{grid-template-columns:215px 1fr}.stats,.chemical-summary{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.content{padding:20px}}
@media(max-width:700px){.shell{display:block}.sidebar{position:fixed;z-index:15;left:-100%;width:280px;transition:.2s}.sidebar.open{left:0}.mobile-menu{display:inline-flex}.topbar{height:60px;padding:0 12px}.content{padding:15px 11px}.pagehead{flex-direction:column}.pagehead h1{font-size:23px}.module-cards,.three,.formgrid,.ob-grid{grid-template-columns:1fr}.span2{grid-column:auto}.card{padding:15px}.stats,.chemical-summary{gap:10px}.stat-value{font-size:25px}.modal{padding:18px}input,select,textarea{font-size:16px!important}.btn{min-height:40px}.drop{padding:22px 12px}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar">
 <div class="brand">HSE Gestion<small>VGP · RISQUE CHIMIQUE</small></div>
 <button class="navbtn active" data-page="home"><span class="ico">⌂</span>Accueil</button>
 <button class="navbtn" data-page="vgp"><span class="ico">⚡</span>VGP & conformité</button>
 <button class="navbtn" data-page="actions"><span class="ico">✓</span>Plan d’actions VGP</button>
 <button class="navbtn" data-page="chim"><span class="ico">🧪</span>Risque chimique</button>
 <button class="navbtn" data-page="settings"><span class="ico">⚙</span>Réglages & Gemini</button>
 <div class="sidefoot">Application autonome.<br>Les données métier restent dans ce navigateur.</div>
</aside>
<main class="main">
<header class="topbar"><div><button class="btn mobile-menu" id="menuBtn">☰</button> <strong id="topTitle">Accueil</strong></div><div class="stack"><button class="btn sm" onclick="exportJSON()">Exporter</button></div></header>
<div class="content" id="app"></div>
</main></div>
<div id="modalRoot"></div>
<script>
const KEY='hse_vgp_chim_gemini_zero_v1';
const defaultTypes=[
 {id:'Q18',name:'Installations électriques — Q18',icon:'⚡',period:12},
 {id:'Q19',name:'Thermographie infrarouge — Q19',icon:'🌡️',period:12},
 {id:'LEVAGE',name:'Appareils et accessoires de levage',icon:'🏗️',period:12},
 {id:'PORTES',name:'Portes, portails et équipements associés',icon:'🚪',period:12},
 {id:'ATEX',name:'ATEX / DRPE',icon:'⚠️',period:12},
 {id:'AUTRE',name:'Autre vérification périodique',icon:'🛠️',period:12}
];
let db=load();let page='home';
function uid(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x||{types:defaultTypes,reports:[],obs:[],actions:[],chemicals:[],settings:{geminiKey:'',geminiModel:'gemini-3.8-flash',alertMonths:6}}}catch(e){return{types:defaultTypes,reports:[],obs:[],actions:[],chemicals:[],settings:{geminiKey:'',geminiModel:'gemini-3.8-flash',alertMonths:6}}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function dateNow(){return new Date().toISOString().slice(0,10)}
function fmtDate(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleDateString('fr-FR')}
function toast(msg){const d=document.createElement('div');d.textContent=msg;Object.assign(d.style,{position:'fixed',right:'18px',bottom:'18px',zIndex:99,background:'#173b32',color:'#fff',padding:'12px 15px',borderRadius:'10px',boxShadow:'0 8px 30px #0003'});document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function showModal(html){document.getElementById('modalRoot').innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>'}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function go(p){page=p;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('topTitle').textContent={home:'Accueil',vgp:'VGP & conformité',actions:'Plan d’actions VGP',chim:'Risque chimique',settings:'Réglages & Gemini'}[p]||p;document.getElementById('app').innerHTML=render(p);if(window.innerWidth<701)document.getElementById('sidebar').classList.remove('open')}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
function render(p){if(p==='home')return home();if(p==='vgp')return vgp();if(p==='actions')return actions();if(p==='chim')return chim();return settings()}
function home(){const open=db.obs.filter(o=>o.status!=='Clôturée').length, overdue=db.actions.filter(a=>a.status!=='Clôturée'&&a.due&&a.due<dateNow()).length, soon=db.chemicals.filter(c=>chemStatus(c)==='soon').length;return `<div class="pagehead"><div><h1>HSE — VGP & Risque chimique</h1><div class="muted">Une application volontairement recentrée sur les deux modules.</div></div></div><div class="grid stats"><div class="card"><div class="stat-label">Rapports VGP</div><div class="stat-value">${db.reports.length}</div><div class="stat-foot">Tous types confondus</div></div><div class="card"><div class="stat-label">NC ouvertes</div><div class="stat-value">${open}</div><div class="stat-foot">Observations à traiter</div></div><div class="card"><div class="stat-label">Actions en retard</div><div class="stat-value">${overdue}</div><div class="stat-foot">Plan d’actions VGP</div></div><div class="card"><div class="stat-label">FDS à surveiller</div><div class="stat-value">${soon}</div><div class="stat-foot">Échéance dans ${db.settings.alertMonths||6} mois</div></div></div><div class="grid module-cards"><div class="card module-card" onclick="go('vgp')"><div class="module-icon">⚡</div><h2>VGP & conformité</h2><p>Créer les rapports, importer les PDF et faire extraire les observations par Gemini.</p><button class="btn primary">Ouvrir VGP</button></div><div class="card module-card" onclick="go('chim')"><div class="module-icon">🧪</div><h2>Risque chimique</h2><p>Produits, FDS, échéances et demandes d’acceptation.</p><button class="btn primary">Ouvrir risque chimique</button></div></div><div class="card" style="margin-top:16px"><h2>Principe Gemini</h2><div class="notice green">Le PDF est envoyé directement à Gemini pour analyse multimodale. Le prompt demande d’identifier toutes les observations/actions du rapport, sans limite arbitraire de nombre, puis l’application affiche le résultat avant création des NC.</div><div class="small muted">Modèle par défaut : ${esc(db.settings.geminiModel)}</div></div>`}
function typeOptions(sel){return db.types.map(t=>`<option value="${esc(t.id)}" ${t.id===sel?'selected':''}>${esc(t.name)}</option>`).join('')}
function vgp(){const reports=db.reports.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<div class="pagehead"><div><h1>VGP & conformité</h1><div class="muted">Suivi des rapports périodiques et extraction intelligente des observations.</div></div><div class="stack"><button class="btn primary" onclick="newReport()">＋ Nouveau rapport</button></div></div><div class="notice">Pour l’analyse IA, utilise <b>Importer un PDF avec Gemini</b> dans un rapport. Gemini reçoit le PDF complet et renvoie des observations structurées.</div><div class="card"><div class="toolbar"><input id="vgpSearch" placeholder="Rechercher un rapport…" oninput="filterReports()"><select id="vgpTypeFilter" onchange="filterReports()"><option value="">Tous les types</option>${typeOptions('')}</select></div><div class="tablewrap"><table id="reportsTable"><thead><tr><th>Rapport</th><th>Type</th><th>Date</th><th>Observations</th><th>État</th><th>Actions</th></tr></thead><tbody>${reports.length?reports.map(r=>{const n=db.obs.filter(o=>o.reportId===r.id),open=n.filter(o=>o.status!=='Clôturée').length;return `<tr data-search="${esc((r.name+' '+r.number+' '+r.site).toLowerCase())}" data-type="${esc(r.typeId)}"><td><b>${esc(r.name||'Rapport VGP')}</b><div class="small muted">${esc(r.number||'')} · ${esc(r.site||'')}</div></td><td>${esc(db.types.find(t=>t.id===r.typeId)?.name||r.typeId)}</td><td>${fmtDate(r.date)}</td><td><b>${n.length}</b> <span class="small muted">(${open} ouvertes)</span></td><td>${r.aiAnalyzed?'<span class="pill">Gemini analysé</span>':'<span class="pill gray">Non analysé</span>'}</td><td><div class="stack"><button class="btn sm" onclick="openReport('${r.id}')">Ouvrir</button><button class="btn sm danger" onclick="deleteReport('${r.id}')">Supprimer</button></div></td></tr>`}).join(''):`<tr><td colspan="6" class="empty">Aucun rapport VGP. Crée ton premier rapport.</td></tr>`}</tbody></table></div></div>`}
function filterReports(){const q=(document.getElementById('vgpSearch')?.value||'').toLowerCase(),t=document.getElementById('vgpTypeFilter')?.value||'';document.querySelectorAll('#reportsTable tbody tr[data-search]').forEach(r=>r.classList.toggle('hidden',!r.dataset.search.includes(q)||(t&&r.dataset.type!==t)))}
function newReport(){showModal(`<div class="modalhead"><div><h2>Nouveau rapport VGP</h2><div class="muted">Tu peux ensuite importer le PDF avec Gemini.</div></div><button class="x" onclick="closeModal()">×</button></div><form id="reportForm"><div class="formgrid"><div class="field"><label>Type de vérification *</label><select name="typeId" required>${typeOptions('Q18')}</select></div><div class="field"><label>Date du rapport *</label><input type="date" name="date" value="${dateNow()}" required></div><div class="field"><label>Nom du rapport</label><input name="name" placeholder="Ex. Vérification installations électriques"></div><div class="field"><label>N° de rapport</label><input name="number"></div><div class="field span2"><label>Site / bâtiment</label><input name="site"></div><div class="field span2"><label>Commentaires</label><textarea name="notes"></textarea></div></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Créer le rapport</button></div></form>`);document.getElementById('reportForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),r={id:uid('r'),typeId:f.get('typeId'),date:f.get('date'),name:f.get('name')||db.types.find(t=>t.id===f.get('typeId'))?.name||'Rapport VGP',number:f.get('number'),site:f.get('site'),notes:f.get('notes'),aiAnalyzed:false,created:new Date().toISOString()};db.reports.push(r);save();closeModal();go('vgp');toast('Rapport créé.');openReport(r.id)}}
function openReport(id){const r=db.reports.find(x=>x.id===id);if(!r)return;const obs=db.obs.filter(o=>o.reportId===id);showModal(`<div class="modalhead"><div><h2>${esc(r.name)}</h2><div class="muted">${esc(r.number||'')} · ${fmtDate(r.date)} · ${esc(r.site||'')}</div></div><button class="x" onclick="closeModal()">×</button></div><div class="toolbar"><button class="btn primary" onclick="geminiImport('${r.id}')">📄 Importer un PDF avec Gemini</button><button class="btn" onclick="manualObs('${r.id}')">＋ Ajouter une observation</button><button class="btn" onclick="editReport('${r.id}')">Modifier le rapport</button></div><div class="notice green">Gemini doit analyser le rapport entier et conserver séparément localisation, équipement, constat, action, référence et page. Les résultats seront affichés ici avant ajout.</div><div id="aiArea"></div><h3 style="margin-top:20px">Observations enregistrées (${obs.length})</h3><div id="obsList">${obs.length?obs.map(obCard).join(''):'<div class="empty">Aucune observation enregistrée.</div>'}</div>`)}
function obCard(o){return `<div class="ob-card"><div class="ob-top"><div><span class="pill ${o.statusType==='recurring'?'orange':''}">${o.statusType==='recurring'?'Récurrente':o.statusType==='new'?'Nouvelle':'À vérifier'}</span> <span class="small muted">Obs. ${esc(o.number||'—')} · page ${esc(o.page||'—')}</span><div class="ob-title" style="margin-top:5px">${esc(o.title||o.finding||'Observation')}</div></div><div class="stack"><button class="btn sm" onclick="editObs('${o.id}')">Modifier</button><button class="btn sm danger" onclick="deleteObs('${o.id}')">Supprimer</button></div></div><div class="ob-grid"><div class="ob-box"><b>Localisation</b>${esc(o.location||'—')}</div><div class="ob-box"><b>Équipement</b>${esc(o.equipment||'—')}</div><div class="ob-box"><b>Constat</b>${esc(o.finding||'—')}</div><div class="ob-box"><b>Action</b>${esc(o.action||'—')}</div></div><div class="small muted" style="margin-top:8px">Références : ${esc(o.references||'—')} · Source : ${esc(o.source||'Gemini')}</div></div>`}
async function geminiImport(reportId){const r=db.reports.find(x=>x.id===reportId);if(!r)return;if(!db.settings.geminiKey){toast('Ajoute d’abord la clé Gemini dans Réglages.');go('settings');return}showModal(`<div class="modalhead"><div><h2>Analyse Gemini du PDF</h2><div class="muted">Le rapport sera analysé dans son ensemble.</div></div><button class="x" onclick="closeModal()">×</button></div><div class="drop"><label class="btn primary">📄 Choisir le PDF<input id="geminiPdf" type="file" accept="application/pdf"></label><div class="small muted" style="margin-top:10px">PDF jusqu’à 50 Mo pour l’envoi direct.</div></div><div id="geminiRun" class="ai-status">En attente du PDF…</div>`);document.getElementById('geminiPdf').onchange=async e=>{const f=e.target.files[0];if(f)await runGeminiPdf(f,reportId)}}
const extractionSchema={type:'object',properties:{reportName:{type:'string'},reportNumber:{type:'string'},reportDate:{type:'string'},observations:{type:'array',items:{type:'object',properties:{number:{type:'integer'},status:{type:'string',enum:['new','recurring','unknown']},page:{type:'integer'},location:{type:'string'},equipment:{type:'string'},finding:{type:'string'},title:{type:'string'},action:{type:'string'},references:{type:'string'},evidence:{type:'string'}},required:['number','status','page','location','equipment','finding','title','action','references','evidence'],propertyOrdering:['number','status','page','location','equipment','finding','title','action','references','evidence']}}},required:['reportName','reportNumber','reportDate','observations'],propertyOrdering:['reportName','reportNumber','reportDate','observations']};
function extractionPrompt(){return `Tu es un expert en lecture de rapports de vérification périodique HSE. Analyse l'intégralité du PDF, page par page, y compris tableaux, encadrés, légendes et éléments visuels. Objectif : extraire TOUTES les observations, non-conformités, anomalies, remarques nécessitant une action ou préconisations présentes dans le rapport. Ne fixe aucune limite arbitraire au nombre d'observations. Une observation distincte dans le rapport doit rester une observation distincte même si l'action est identique à une autre. Ne déduplique pas simplement parce que le texte se ressemble. Respecte la numérotation du rapport si elle existe. Si la légende distingue nouvelle observation et observation récurrente, conserve cette information. Sépare strictement : localisation, équipement, constat, titre court de la NC, action à réaliser, références réglementaires, page. Le titre et l'action doivent être courts et opérationnels. N'intègre pas les références réglementaires dans le titre ou l'action. N'invente aucune information absente. Si une information n'est pas identifiable, laisse une chaîne vide ou status unknown. evidence doit être une courte justification textuelle permettant de comprendre d'où vient l'extraction, pas une copie longue du rapport. Le résultat doit couvrir tout le PDF, pas seulement la première liste ou les premières pages.`}
async function runGeminiPdf(file,reportId){const box=document.getElementById('geminiRun');box.className='ai-status busy';box.innerHTML='Lecture du PDF puis analyse Gemini…';try{if(file.size>50*1024*1024)throw new Error('Le PDF dépasse 50 Mo.');const b64=await fileToBase64(file);const key=db.settings.geminiKey.trim();const model=db.settings.geminiModel||'gemini-3.8-flash';const body={contents:[{role:'user',parts:[{text:extractionPrompt()},{inlineData:{mimeType:'application/pdf',data:b64}}]}],generationConfig:{responseMimeType:'application/json',responseSchema:extractionSchema,temperature:0.1}};const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const raw=await res.text();if(!res.ok)throw new Error(parseGeminiError(raw));const data=JSON.parse(raw);const txt=data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';if(!txt)throw new Error('Gemini n’a retourné aucun résultat.');let out=JSON.parse(txt);if(!Array.isArray(out.observations))out.observations=[];const normalized=out.observations.map((o,i)=>normalizeAIObs(o,i+1));showAIResults(reportId,out,normalized,file.name);box.remove()}catch(err){box.className='ai-status err';box.textContent='Erreur : '+err.message}}
function parseGeminiError(raw){try{const j=JSON.parse(raw);return j.error?.message||'Erreur Gemini';}catch(e){return raw.slice(0,300)||'Erreur Gemini'}}
function fileToBase64(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(String(fr.result).split(',')[1]);fr.onerror=()=>reject(fr.error||new Error('Lecture du PDF impossible'));fr.readAsDataURL(file)})}
function normalizeAIObs(o,i){return{number:Number.isFinite(Number(o.number))?Number(o.number):i,statusType:['new','recurring'].includes(o.status)?o.status:'unknown',page:Number(o.page)||0,location:String(o.location||''),equipment:String(o.equipment||''),finding:String(o.finding||''),title:String(o.title||o.finding||('Observation '+i)),action:String(o.action||''),references:String(o.references||''),evidence:String(o.evidence||''),source:'Gemini'}}
function showAIResults(reportId,out,list,fileName){const r=db.reports.find(x=>x.id===reportId);const old=new Set(db.obs.filter(o=>o.reportId===reportId).map(o=>dedupeKey(o)));let checked=list.filter(o=>!old.has(dedupeKey(o)));const html=`<div class="modalhead"><div><h2>Résultat Gemini</h2><div class="muted">${esc(fileName)} · ${list.length} observation(s) détectée(s)</div></div><button class="x" onclick="closeModal()">×</button></div><div class="notice green"><b>Contrôle avant enregistrement :</b> rien n'est ajouté automatiquement. Vérifie la liste puis utilise « Tout ajouter au plan » ou ajoute les lignes une par une.</div><div class="stack" style="margin-bottom:10px"><span class="pill">${list.length} détectées</span><span class="pill blue">${checked.length} nouvelles</span><button class="btn primary" onclick='acceptAIResults(${JSON.stringify(reportId)},window.__aiResults)'>✓ Tout ajouter au plan</button></div><div>${list.map((o,i)=>`<div class="ob-card"><div class="ob-top"><div><span class="pill ${o.statusType==='recurring'?'orange':''}">${o.statusType==='recurring'?'Récurrente':o.statusType==='new'?'Nouvelle':'À vérifier'}</span> <span class="small muted">Obs. ${esc(o.number)} · p.${esc(o.page)}</span><div class="ob-title" style="margin-top:5px">${esc(o.title)}</div></div><label class="checkrow"><input type="checkbox" data-ai-index="${i}" checked> Ajouter</label></div><div class="ob-grid"><div class="ob-box"><b>Localisation</b>${esc(o.location||'—')}</div><div class="ob-box"><b>Équipement</b>${esc(o.equipment||'—')}</div><div class="ob-box"><b>Constat</b>${esc(o.finding||'—')}</div><div class="ob-box"><b>Action</b>${esc(o.action||'—')}</div></div><div class="small muted" style="margin-top:8px">Références : ${esc(o.references||'—')} · ${esc(o.evidence||'')}</div></div>`).join('')}</div>`;window.__aiResults=list;showModal(html)}
function dedupeKey(o){return [o.number||'',o.page||'',o.location||'',o.finding||'',o.action||''].join('|').toLowerCase().replace(/\s+/g,' ').trim()}
function acceptAIResults(reportId,list){const checks=[...document.querySelectorAll('[data-ai-index]')].filter(x=>x.checked).map(x=>Number(x.dataset.aiIndex));let added=0;const existing=new Set(db.obs.filter(o=>o.reportId===reportId).map(dedupeKey));checks.forEach(i=>{const o=list[i];if(!o||existing.has(dedupeKey(o)))return;const item={...o,id:uid('obs'),reportId,status:'À traiter',created:new Date().toISOString()};db.obs.push(item);db.actions.push({id:uid('act'),obsId:item.id,reportId,title:item.title,location:item.location,equipment:item.equipment,action:item.action,status:'À traiter',due:'',priority:'Normale',created:new Date().toISOString()});existing.add(dedupeKey(item));added++});const r=db.reports.find(x=>x.id===reportId);if(r){r.aiAnalyzed=true;r.aiFileName=window.__aiFileName||r.aiFileName}save();closeModal();openReport(reportId);toast(added+' observation(s) ajoutée(s) au plan.');}
function editReport(id){const r=db.reports.find(x=>x.id===id);if(!r)return;closeModal();showModal(`<div class="modalhead"><div><h2>Modifier le rapport</h2></div><button class="x" onclick="closeModal()">×</button></div><form id="editR"><div class="formgrid"><div class="field"><label>Type</label><select name="typeId">${typeOptions(r.typeId)}</select></div><div class="field"><label>Date</label><input type="date" name="date" value="${esc(r.date)}"></div><div class="field"><label>Nom</label><input name="name" value="${esc(r.name)}"></div><div class="field"><label>N°</label><input name="number" value="${esc(r.number)}"></div><div class="field span2"><label>Site / bâtiment</label><input name="site" value="${esc(r.site)}"></div></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer</button></div></form>`);document.getElementById('editR').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(r,{typeId:f.get('typeId'),date:f.get('date'),name:f.get('name'),number:f.get('number'),site:f.get('site')});save();closeModal();openReport(id);}}
function manualObs(reportId,existing){const o=existing||{};showModal(`<div class="modalhead"><div><h2>${existing?'Modifier':'Ajouter'} une observation</h2></div><button class="x" onclick="closeModal()">×</button></div><form id="obForm"><div class="formgrid"><div class="field"><label>Numéro</label><input name="number" type="number" value="${esc(o.number||'')}"></div><div class="field"><label>Page</label><input name="page" type="number" value="${esc(o.page||'')}"></div><div class="field"><label>Statut</label><select name="status"><option value="unknown">À vérifier</option><option value="new" ${o.statusType==='new'?'selected':''}>Nouvelle</option><option value="recurring" ${o.statusType==='recurring'?'selected':''}>Récurrente</option></select></div><div class="field"><label>Localisation</label><input name="location" value="${esc(o.location)}"></div><div class="field"><label>Équipement</label><input name="equipment" value="${esc(o.equipment)}"></div><div class="field"><label>Titre court de la NC</label><input name="title" value="${esc(o.title)}"></div><div class="field span2"><label>Constat</label><textarea name="finding">${esc(o.finding)}</textarea></div><div class="field span2"><label>Action</label><textarea name="action">${esc(o.action)}</textarea></div><div class="field span2"><label>Références</label><input name="references" value="${esc(o.references)}"></div></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer</button></div></form>`);document.getElementById('obForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),payload={number:f.get('number'),page:f.get('page'),statusType:f.get('status'),location:f.get('location'),equipment:f.get('equipment'),title:f.get('title'),finding:f.get('finding'),action:f.get('action'),references:f.get('references')};if(existing)Object.assign(existing,payload);else{const n={id:uid('obs'),reportId,...payload,status:'À traiter',source:'Manuel',created:new Date().toISOString()};db.obs.push(n);db.actions.push({id:uid('act'),obsId:n.id,reportId,title:n.title,location:n.location,equipment:n.equipment,action:n.action,status:'À traiter',due:'',priority:'Normale',created:new Date().toISOString()})}save();closeModal();openReport(reportId);}}
function editObs(id){const o=db.obs.find(x=>x.id===id);if(o)manualObs(o.reportId,o)}
function deleteObs(id){if(!confirm('Supprimer cette observation ?'))return;db.obs=db.obs.filter(x=>x.id!==id);db.actions=db.actions.filter(x=>x.obsId!==id);save();go('vgp');toast('Observation supprimée.')}
function deleteReport(id){if(!confirm('Supprimer le rapport et ses observations/actions ?'))return;db.reports=db.reports.filter(x=>x.id!==id);const os=db.obs.filter(o=>o.reportId===id).map(o=>o.id);db.obs=db.obs.filter(o=>o.reportId!==id);db.actions=db.actions.filter(a=>a.reportId!==id&&!os.includes(a.obsId));save();go('vgp');toast('Rapport supprimé.')}
function actions(){const rows=db.actions.slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));return `<div class="pagehead"><div><h1>Plan d’actions VGP</h1><div class="muted">Toutes les actions issues des observations VGP.</div></div></div><div class="card"><div class="toolbar"><select id="actStatus" onchange="filterActions()"><option value="">Tous les statuts</option><option>À traiter</option><option>En cours</option><option>Clôturée</option></select><input id="actSearch" placeholder="Rechercher…" oninput="filterActions()"></div><div class="tablewrap"><table id="actionsTable"><thead><tr><th>Action</th><th>Localisation</th><th>Équipement</th><th>Échéance</th><th>Statut</th><th>Actions</th></tr></thead><tbody>${rows.length?rows.map(a=>`<tr data-status="${esc(a.status)}" data-search="${esc((a.title+' '+a.location+' '+a.equipment+' '+a.action).toLowerCase())}"><td><b>${esc(a.title)}</b><div class="small muted">${esc(a.action)}</div></td><td>${esc(a.location||'—')}</td><td>${esc(a.equipment||'—')}</td><td>${a.due?fmtDate(a.due):'—'}</td><td><select onchange="setActionStatus('${a.id}',this.value)"><option ${a.status==='À traiter'?'selected':''}>À traiter</option><option ${a.status==='En cours'?'selected':''}>En cours</option><option ${a.status==='Clôturée'?'selected':''}>Clôturée</option></select></td><td><button class="btn sm" onclick="editAction('${a.id}')">Modifier</button></td></tr>`).join(''):`<tr><td colspan="6" class="empty">Aucune action.</td></tr>`}</tbody></table></div></div>`}
function filterActions(){const q=(document.getElementById('actSearch')?.value||'').toLowerCase(),s=document.getElementById('actStatus')?.value||'';document.querySelectorAll('#actionsTable tbody tr[data-search]').forEach(r=>r.classList.toggle('hidden',!r.dataset.search.includes(q)||(s&&r.dataset.status!==s)))}
function setActionStatus(id,v){const a=db.actions.find(x=>x.id===id);if(a){a.status=v;const o=db.obs.find(x=>x.id===a.obsId);if(o)o.status=v;save();go('actions')}}
function editAction(id){const a=db.actions.find(x=>x.id===id);if(!a)return;showModal(`<div class="modalhead"><div><h2>Modifier l’action</h2></div><button class="x" onclick="closeModal()">×</button></div><form id="af"><div class="formgrid"><div class="field span2"><label>Intitulé</label><input name="title" value="${esc(a.title)}"></div><div class="field span2"><label>Action à réaliser</label><textarea name="action">${esc(a.action)}</textarea></div><div class="field"><label>Échéance</label><input type="date" name="due" value="${esc(a.due)}"></div><div class="field"><label>Priorité</label><select name="priority"><option ${a.priority==='Normale'?'selected':''}>Normale</option><option ${a.priority==='Haute'?'selected':''}>Haute</option><option ${a.priority==='Critique'?'selected':''}>Critique</option></select></div></div><div class="form-actions"><button class="btn">Enregistrer</button></div></form>`);document.getElementById('af').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(a,{title:f.get('title'),action:f.get('action'),due:f.get('due'),priority:f.get('priority')});save();closeModal();go('actions')}}
function chem(){const items=db.chemicals;return `<div class="pagehead"><div><h1>Risque chimique</h1><div class="muted">Produits chimiques, FDS, échéances et acceptation.</div></div><button class="btn primary" onclick="newChemical()">＋ Ajouter un produit</button></div><div class="grid chemical-summary"><div class="card"><div class="stat-label">Produits</div><div class="stat-value">${items.length}</div></div><div class="card"><div class="stat-label">FDS manquantes</div><div class="stat-value">${items.filter(c=>chemStatus(c)==='missing').length}</div></div><div class="card"><div class="stat-label">FDS bientôt échues</div><div class="stat-value">${items.filter(c=>chemStatus(c)==='soon').length}</div></div><div class="card"><div class="stat-label">FDS échues</div><div class="stat-value">${items.filter(c=>chemStatus(c)==='late').length}</div></div></div><div class="card" style="margin-top:16px"><div class="toolbar"><input id="chemSearch" placeholder="Produit, fabricant…" oninput="filterChem()"><select id="chemStatus" onchange="filterChem()"><option value="">Tous</option><option value="missing">FDS manquante</option><option value="soon">Bientôt échue</option><option value="late">Échue</option><option value="ok">Valide</option></select></div><div class="tablewrap"><table id="chemTable"><thead><tr><th>Produit</th><th>Fabricant</th><th>Danger</th><th>Date FDS</th><th>État</th><th>Actions</th></tr></thead><tbody>${items.length?items.map(c=>{const s=chemStatus(c);return `<tr data-status="${s}" data-search="${esc((c.name+' '+c.manufacturer+' '+c.hazards).toLowerCase())}"><td><b>${esc(c.name)}</b><div class="small muted">${esc(c.reference||'')}</div></td><td>${esc(c.manufacturer||'—')}</td><td><div class="hazards">${(c.hazards||[]).map(h=>`<span class="hazard">${esc(h)}</span>`).join('')||'—'}</div></td><td>${fmtDate(c.fdsDate)}</td><td class="${'status-'+s}">${s==='ok'?'Valide':s==='soon'?'Bientôt échue':s==='late'?'Échue':'FDS manquante'}</td><td><button class="btn sm" onclick="editChemical('${c.id}')">Modifier</button> <button class="btn sm danger" onclick="deleteChemical('${c.id}')">Supprimer</button></td></tr>`}).join(''):`<tr><td colspan="6" class="empty">Aucun produit enregistré.</td></tr>`}</tbody></table></div></div>`}
function chemStatus(c){if(!c.fdsDate)return'missing';const d=new Date(c.fdsDate),now=new Date(),soon=new Date();soon.setMonth(soon.getMonth()+Number(db.settings.alertMonths||6));if(d<now)return'late';if(d<=soon)return'soon';return'ok'}
function filterChem(){const q=(document.getElementById('chemSearch')?.value||'').toLowerCase(),s=document.getElementById('chemStatus')?.value||'';document.querySelectorAll('#chemTable tbody tr[data-search]').forEach(r=>r.classList.toggle('hidden',!r.dataset.search.includes(q)||(s&&r.dataset.status!==s)))}
function newChemical(){editChemical(null)}
function editChemical(id){const c=id?db.chemicals.find(x=>x.id===id):{};showModal(`<div class="modalhead"><div><h2>${id?'Modifier le produit':'Ajouter un produit chimique'}</h2></div><button class="x" onclick="closeModal()">×</button></div><form id="cf"><div class="formgrid"><div class="field"><label>Produit *</label><input name="name" required value="${esc(c.name)}"></div><div class="field"><label>Fabricant</label><input name="manufacturer" value="${esc(c.manufacturer)}"></div><div class="field"><label>Référence / code</label><input name="reference" value="${esc(c.reference)}"></div><div class="field"><label>Date de la FDS *</label><input type="date" name="fdsDate" value="${esc(c.fdsDate)}"></div><div class="field span2"><label>Dangers / classifications</label><input name="hazards" value="${esc((c.hazards||[]).join(', '))}" placeholder="Ex. CMR, inflammable, corrosif"></div><div class="field span2"><label>Unité(s) / utilisation</label><input name="use" value="${esc(c.use)}"></div><div class="field span2"><label>Commentaire</label><textarea name="notes">${esc(c.notes)}</textarea></div><div class="field span2"><label>Demande d’acceptation</label><select name="accept"><option value="none">Aucune</option><option value="review" ${c.accept==='review'?'selected':''}>À examiner</option><option value="accepted" ${c.accept==='accepted'?'selected':''}>Acceptée</option><option value="refused" ${c.accept==='refused'?'selected':''}>Refusée</option></select></div></div><div class="notice">La surveillance d’échéance est calculée à partir de la date de FDS. Le délai d’alerte est configurable dans les réglages.</div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer</button></div></form>`);document.getElementById('cf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),payload={name:f.get('name'),manufacturer:f.get('manufacturer'),reference:f.get('reference'),fdsDate:f.get('fdsDate'),hazards:String(f.get('hazards')||'').split(',').map(x=>x.trim()).filter(Boolean),use:f.get('use'),notes:f.get('notes'),accept:f.get('accept')};if(id)Object.assign(c,payload);else db.chemicals.push({id:uid('chem'),...payload,created:new Date().toISOString()});save();closeModal();go('chim');toast('Produit enregistré.')}}
function deleteChemical(id){if(!confirm('Supprimer ce produit ?'))return;db.chemicals=db.chemicals.filter(x=>x.id!==id);save();go('chim')}
function settings(){return `<div class="pagehead"><div><h1>Réglages & Gemini</h1><div class="muted">Configuration de l’analyse IA et des alertes chimiques.</div></div></div><div class="grid two"><div class="card"><h2>Gemini</h2><div class="notice">Pour ce prototype, la clé API est utilisée directement par le navigateur. <b>Ne partage pas le fichier HTML avec une clé déjà enregistrée.</b> Pour une future commercialisation, il faudra déplacer l’appel API vers un serveur.</div><div class="field"><label>Clé API Gemini</label><input id="gemKey" type="password" value="${esc(db.settings.geminiKey)}" placeholder="AIza…"></div><div class="field"><label>Modèle</label><select id="gemModel"><option value="gemini-3.8-flash" ${db.settings.geminiModel==='gemini-3.8-flash'?'selected':''}>Gemini 3.8 Flash — recommandé</option><option value="gemini-3.7-flash" ${db.settings.geminiModel==='gemini-3.7-flash'?'selected':''}>Gemini 3.7 Flash</option><option value="gemini-3.5-flash-lite" ${db.settings.geminiModel==='gemini-3.5-flash-lite'?'selected':''}>Gemini 3.5 Flash-Lite</option></select></div><div class="stack"><button class="btn primary" onclick="saveGemini()">Enregistrer Gemini</button><button class="btn" onclick="testGemini()">Tester la connexion</button></div><div id="testStatus" class="ai-status hidden"></div><div class="settings-note" style="margin-top:14px">Le modèle est configuré pour produire du JSON structuré. L’analyse des PDF est multimodale : texte, tableaux, mise en page et éléments visuels peuvent être pris en compte.</div></div><div class="card"><h2>Risque chimique</h2><div class="field"><label>Alerte FDS avant échéance</label><select id="alertMonths"><option value="3" ${Number(db.settings.alertMonths)===3?'selected':''}>3 mois</option><option value="6" ${Number(db.settings.alertMonths)===6?'selected':''}>6 mois</option><option value="9" ${Number(db.settings.alertMonths)===9?'selected':''}>9 mois</option><option value="12" ${Number(db.settings.alertMonths)===12?'selected':''}>12 mois</option></select></div><button class="btn primary" onclick="saveChemSettings()">Enregistrer</button><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>Données</h3><div class="stack"><button class="btn" onclick="exportJSON()">Exporter JSON</button><button class="btn danger" onclick="resetData()">Réinitialiser</button></div></div></div>`}
function saveGemini(){db.settings.geminiKey=document.getElementById('gemKey').value.trim();db.settings.geminiModel=document.getElementById('gemModel').value;save();toast('Réglages Gemini enregistrés.')}
async function testGemini(){saveGemini();const el=document.getElementById('testStatus');el.className='ai-status busy';el.classList.remove('hidden');el.textContent='Test en cours…';try{const key=db.settings.geminiKey;if(!key)throw new Error('Clé API absente.');const model=db.settings.geminiModel;const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Réponds uniquement par OK.'}]}],generationConfig:{temperature:0,responseMimeType:'text/plain'}})});const raw=await res.text();if(!res.ok)throw new Error(parseGeminiError(raw));el.className='ai-status ok';el.textContent='Connexion Gemini OK.'}catch(e){el.className='ai-status err';el.textContent='Échec : '+e.message}}
function saveChemSettings(){db.settings.alertMonths=Number(document.getElementById('alertMonths').value);save();toast('Réglages chimiques enregistrés.');go('chim')}
function exportJSON(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hse-vgp-risque-chimique-sauvegarde.json';a.click();URL.revokeObjectURL(a.href)}

go('home');
</script></body></html>
