<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b32">
<title>SGE HSE — VGP & Risque chimique</title>
<style>
:root{
  --nav:#173b32;--nav2:#245747;--bg:#f3f6f5;--card:#fff;--ink:#182824;
  --muted:#667873;--line:#dce5e1;--accent:#25815e;--warn:#c27b14;--red:#b83b3b;
  --blue:#356bb3;--purple:#6852b5;--radius:16px
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.shell{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
.sidebar{background:var(--nav);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:20px;font-weight:850;padding:8px 12px 20px}.brand small{display:block;font-size:10px;font-weight:600;opacity:.7;letter-spacing:1.5px;margin-top:4px}
.navbtn{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;color:#dce9e3;padding:13px 12px;border-radius:11px;text-align:left;margin:3px 0}
.navbtn:hover,.navbtn.active{background:#ffffff20;color:#fff}.navbtn .ico{width:25px;text-align:center;font-size:18px}
.sidefoot{font-size:11px;color:#bad0c6;margin:20px 12px}
.main{min-width:0}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
.topbar strong{font-size:18px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.content{padding:26px;max-width:1600px;margin:auto}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.pagehead h1{margin:0;font-size:28px}.muted{color:var(--muted)}.small{font-size:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;color:var(--ink);font-weight:700}
.btn:hover{background:#f7faf8}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{filter:brightness(.96)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red)}.btn.sm{font-size:12px;padding:6px 9px}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:18px}.two{grid-template-columns:1.2fr .8fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:19px;min-width:0;box-shadow:0 2px 8px #18392b05}
.stat-label{color:var(--muted);font-size:13px}.stat-value{font-size:29px;font-weight:850;margin:7px 0 3px}.stat-foot{font-size:12px;color:var(--muted)}
h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 8px}
.pill{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800;background:#eaf2ee;color:#27644d;white-space:nowrap}
.pill.red{background:#fde9e7;color:#a12e2a}.pill.orange{background:#fff1d9;color:#88540a}.pill.blue{background:#e8f0fc;color:#2d5d9a}.pill.purple{background:#eeeafd;color:#5742a5}.pill.gray{background:#edf0ef;color:#56645f}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f7faf8;color:#60716b;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
tr:last-child td{border-bottom:0}.empty{text-align:center;padding:35px;color:var(--muted)}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{max-width:280px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:12px;font-weight:800;color:#52645d}.checkbox-label{display:flex!important;align-items:center;gap:8px;cursor:pointer}.checkbox-label input[type=checkbox]{width:18px!important;height:18px!important;min-width:18px;padding:0!important;margin:0;accent-color:var(--accent)}
.field input,.field select,.field textarea,input,select,textarea{border:1px solid #ccd8d2;border-radius:9px;padding:10px;background:#fff;color:var(--ink);width:100%}
.field textarea{min-height:92px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.span2{grid-column:1/-1}
.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.stack{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.notice{padding:12px 14px;border-radius:11px;background:#fff5df;color:#765016;font-size:13px;margin-bottom:14px}.notice.green{background:#e8f4ed;color:#235d43}.notice.blue{background:#e8f0fc;color:#2d5d9a}.notice.red{background:#fde9e7;color:#8e302b}
.overlay{position:fixed;inset:0;background:#0b211bb0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}.modal{background:#fff;border-radius:17px;width:min(980px,100%);max-height:94vh;overflow:auto;padding:23px;box-shadow:0 20px 80px #0003}
.modalhead{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:17px}.modalhead h2{margin:0}.x{border:0;background:#eef2ef;border-radius:50%;width:34px;height:34px;font-size:20px}
.mobile-menu{display:none}
.progress{height:10px;background:#e9efec;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent)}
.kpi-list{display:grid;gap:9px}.kpi-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}.kpi-row:last-child{border-bottom:0}
.family-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.family-card{cursor:pointer;position:relative;transition:.15s}.family-card:hover{transform:translateY(-2px);border-color:#9bbdaf}
.family-icon{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;font-size:29px;background:linear-gradient(135deg,#eef7f2,#dfece6);margin-bottom:11px}
.family-card h3{font-size:16px}.family-card .meta{color:var(--muted);font-size:12px}.family-foot{margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.breadcrumb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#f7faf8;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;color:#47625a}
.chip.click{cursor:pointer}.chip.click:hover{border-color:#9bbdaf;background:#eef6f2}
.page-actions{display:flex;gap:7px;flex-wrap:wrap}.page-actions .btn{white-space:nowrap}
.report-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.ai-panel{border:1px solid #cfd9f2;background:#f7f9ff;border-radius:15px;padding:15px}
.ai-title{display:flex;align-items:center;gap:9px;font-weight:850}.ai-orb{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#6357cb,#7b6ef0);color:#fff;display:grid;place-items:center}
.ai-status{font-size:12px;color:#5867a2;margin-top:4px}.ai-diag{padding:10px 12px;border:1px solid #dfe5f5;border-radius:11px;background:#fbfcff;margin-top:10px;font-size:12px}.ai-diag.ok{background:#eef8f2;border-color:#cfe5d8;color:#2d694f}.ai-diag.err{background:#fff0ee;border-color:#f0cbc5;color:#934039}.ai-progress{margin-top:8px;height:7px;background:#e9edf7;border-radius:99px;overflow:hidden}.ai-progress span{display:block;height:100%;background:#6757c7;transition:width .2s}.dropzone{border:2px dashed #cbd6d1;border-radius:13px;padding:17px;text-align:center;background:#fbfcfb}
.dropzone.drag{border-color:var(--accent);background:#edf9f2}
.ai-result{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;margin-top:12px}.ai-finding{border:1px solid var(--line);border-radius:11px;padding:11px;margin:8px 0;background:#fff}
.ai-finding-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.ai-confidence{font-size:10px;font-weight:900;border-radius:999px;padding:4px 7px;background:#eeeafd;color:#5742a5;white-space:nowrap}
.finding-open td:first-child{border-left:4px solid var(--red)}.finding-progress td:first-child{border-left:4px solid var(--warn)}.finding-closed td:first-child{border-left:4px solid var(--accent)}
.overdue{color:var(--red);font-weight:850}.soon{color:#9a6410;font-weight:850}.ok{color:#2b6f55;font-weight:850}
.detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.detail-box{padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#f8faf9}.detail-box .label{color:var(--muted);font-size:11px}.detail-box b{display:block;margin-top:2px}
.plan-table{min-width:1050px}
.chemical-summary{grid-template-columns:repeat(5,minmax(0,1fr))}
.chem-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.chem-tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:800}.chem-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.unit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#f9fbfa;max-height:190px;overflow:auto}.unit-grid label{display:flex;gap:7px;align-items:center;padding:7px;border:1px solid #edf1ef;border-radius:8px;background:#fff;font-size:12px}.unit-grid input{width:auto}
.hazard-stack{display:flex;gap:5px;flex-wrap:wrap}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:850;background:#eef0ff;color:#4e4ba3}.badge.red{background:#fde9e7;color:#a12e2a}.badge.orange{background:#fff1d9;color:#88540a}.badge.blue{background:#e8f0fc;color:#2d5d9a}.badge.gray{background:#edf0ef;color:#56645f}
.fds-ok{color:#2b6f55;font-weight:850}.fds-soon{color:#9a6410;font-weight:850}.fds-late{color:var(--red);font-weight:850}.fds-missing{color:#88540a;font-weight:850}
.help{font-size:12px;color:var(--muted);line-height:1.45}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:22px 0 10px}.section-head h2{margin:0}
.tag{display:inline-block;font-size:10px;font-weight:850;border-radius:7px;padding:3px 6px;background:#edf0ef;color:#56645f}.tag.ai{background:#eeeafd;color:#5742a5}.tag.man{background:#e8f0fc;color:#2d5d9a}
.file-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.file-row:last-child{border-bottom:0}
.hidden{display:none!important}.nowrap{white-space:nowrap}
.settings-card{max-width:850px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--line)}.switch-row:last-child{border-bottom:0}
.switch{position:relative;width:48px;height:26px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#cdd7d2;border-radius:99px;transition:.2s}.slider:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:var(--accent)}.switch input:checked+.slider:before{transform:translateX(22px)}
.toast{position:fixed;right:18px;bottom:18px;z-index:40;background:#163c31;color:#fff;padding:12px 15px;border-radius:11px;box-shadow:0 10px 40px #0003;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
@media(max-width:1150px){.stats,.chemical-summary{grid-template-columns:repeat(3,minmax(0,1fr))}.family-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.report-grid{grid-template-columns:1fr}.detail-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){
  .shell{display:block}.sidebar{position:fixed;z-index:30;left:-100%;top:0;width:82vw;max-width:310px;height:100dvh;transition:left .2s;padding-top:calc(20px + env(safe-area-inset-top))}.sidebar.open{left:0;box-shadow:0 0 0 100vmax #0007}
  .mobile-menu{display:inline-flex}.topbar{height:60px;padding:calc(env(safe-area-inset-top)) 12px 0}.topbar strong{font-size:16px}.top-actions .hide-mobile{display:none}
  .content{padding:14px 12px calc(28px + env(safe-area-inset-bottom))}.pagehead{flex-direction:column}.pagehead h1{font-size:23px}.page-actions{width:100%}.page-actions .btn{flex:1}
  .stats,.chemical-summary{grid-template-columns:1fr 1fr}.family-grid{grid-template-columns:1fr}.two,.three{grid-template-columns:1fr}
  .formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.detail-grid{grid-template-columns:1fr 1fr}
  .toolbar input,.toolbar select{max-width:none;flex:1;min-width:140px}.modal{padding:17px}.overlay{padding:0;align-items:flex-end}.overlay .modal{width:100%;max-height:94dvh;border-radius:18px 18px 0 0}
  .modalhead{position:sticky;top:0;background:#fff;z-index:2;padding:13px 0 9px;border-bottom:1px solid var(--line)}
  .unit-grid{grid-template-columns:1fr}.report-grid{gap:12px}.dropzone{padding:14px}.tablewrap.m-cards{overflow:visible;border:0;background:transparent}.tablewrap.m-cards table,.tablewrap.m-cards tbody{display:block;min-width:0;width:100%}
  .tablewrap.m-cards thead{display:none}.tablewrap.m-cards tr{display:block;border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-bottom:10px;background:#fff}.tablewrap.m-cards td{display:block;border-bottom:1px dashed var(--line);padding:8px 0}.tablewrap.m-cards td:last-child{border-bottom:0}.tablewrap.m-cards td[data-label]::before{content:attr(data-label);display:block;font-size:10px;font-weight:850;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">◆ SGE HSE<small>VGP • RISQUE CHIMIQUE • IA</small></div>
    <nav id="nav"></nav>
    <div class="sidefoot">Prototype autonome • données stockées dans ce navigateur<br>Export / import JSON disponible</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:11px">
        <button class="btn mobile-menu" onclick="toggleMenu()">☰</button>
        <strong id="topTitle">VGP & conformité</strong>
      </div>
      <div class="top-actions">
        <button class="btn hide-mobile" onclick="exportJSON()">⇩ Export</button>
        <button class="btn primary" onclick="quickNew()">＋ Nouvelle saisie</button>
      </div>
    </header>
    <div class="content" id="app"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script>
const PDFJS_SOURCES=[
  {lib:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',worker:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'},
  {lib:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',worker:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'}
];
let __pdfjsPromise=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(__pdfjsPromise)return __pdfjsPromise;
  __pdfjsPromise=(async()=>{
    let lastErr;
    for(const src of PDFJS_SOURCES){
      try{
        await new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src=src.lib;sc.onload=ok;sc.onerror=()=>ko(new Error('chargement '+src.lib+' impossible'));document.head.appendChild(sc)});
        if(window.pdfjsLib){window.pdfjsLib.GlobalWorkerOptions.workerSrc=src.worker;return window.pdfjsLib}
      }catch(e){lastErr=e}
    }
    __pdfjsPromise=null;throw lastErr||new Error('pdf.js introuvable');
  })();
  return __pdfjsPromise;
}

const MODULES=[
  {id:'vgp',name:'VGP & conformité',icon:'⚙'},
  {id:'chemical',name:'Risque chimique',icon:'⚗'},
  {id:'settings',name:'Paramètres / données',icon:'⚙'}
];

const VGP_DEFAULTS=[
  {key:'Q18',code:'Q18',name:'Électricité',icon:'⚡',desc:'Vérification électrique',periodicityMonths:12,alertDays:30},
  {key:'Q19',code:'Q19',name:'Thermographie',icon:'🌡️',desc:'Thermographie infrarouge',periodicityMonths:12,alertDays:30},
  {key:'LEVAGE',code:'LEVAGE',name:'Appareils de levage',icon:'🏗️',desc:'Vérifications périodiques des appareils de levage',periodicityMonths:12,alertDays:30},
  {key:'PORTES',code:'PORTES',name:'Portes / portails / portes souples',icon:'🚪',desc:'Vérifications des portes, portails et portes souples',periodicityMonths:12,alertDays:30}
];

let current='vgp';
let vgpView={view:'home',typeKey:'',reportId:''};
let chemicalTab='products';
let aiSettings={enabled:true,endpoint:'http://localhost:11434/v1/chat/completions',model:'llama3.2'};
let aiBusy=false;
let db=loadDB();

function now(){return new Date().toISOString().slice(0,10)}
function addMonths(iso,n){const d=new Date(String(iso)+'T00:00:00');if(Number.isNaN(d.getTime()))return '';d.setMonth(d.getMonth()+Number(n||0));return d.toISOString().slice(0,10)}
function addYears(iso,n){return addMonths(iso,Number(n||0)*12)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2400)}
function saveDB(){localStorage.setItem('sgeHseVgpChemicalDB',JSON.stringify(db))}
function loadDB(){
  try{
    const x=JSON.parse(localStorage.getItem('sgeHseVgpChemicalDB')||'null')||{};
    const types=Array.isArray(x.vgpTypes)&&x.vgpTypes.length?x.vgpTypes:VGP_DEFAULTS;
    return {
      vgpTypes:types.map(t=>({...t,periodicityMonths:Number(t.periodicityMonths)||12,alertDays:Number(t.alertDays)||30})),
      vgpEquipment:Array.isArray(x.vgpEquipment)?x.vgpEquipment:[],
      vgpReports:Array.isArray(x.vgpReports)?x.vgpReports:[],
      vgpFindings:Array.isArray(x.vgpFindings)?x.vgpFindings:[],
      chemicalProducts:Array.isArray(x.chemicalProducts)?x.chemicalProducts:[],
      chemicalRequests:Array.isArray(x.chemicalRequests)?x.chemicalRequests:[],
      chemicalActions:Array.isArray(x.chemicalActions)?x.chemicalActions:[],
      workUnits:Array.isArray(x.workUnits)?x.workUnits:[],
      personnel:Array.isArray(x.personnel)?x.personnel:[],
      chemicalSettings:x.chemicalSettings||{fdsAgeYears:5,alertMonths:6},
      aiSettings:x.aiSettings||null
    };
  }catch{return {vgpTypes:VGP_DEFAULTS,vgpEquipment:[],vgpReports:[],vgpFindings:[],chemicalProducts:[],chemicalRequests:[],chemicalActions:[],workUnits:[],personnel:[],chemicalSettings:{fdsAgeYears:5,alertMonths:6}}}
}

function nav(){
  document.getElementById('nav').innerHTML=MODULES.map(m=>`<button class="navbtn ${current===m.id?'active':''}" onclick="go('${m.id}')"><span class="ico">${m.icon}</span><span>${m.name}</span></button>`).join('');
  document.getElementById('topTitle').textContent=MODULES.find(x=>x.id===current)?.name||'SGE HSE';
}
function go(id){current=id;document.getElementById('sidebar').classList.remove('open');nav();render()}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
function render(){nav();const el=document.getElementById('app');if(current==='vgp')return vgpPage(el);if(current==='chemical')return chemicalPage(el);settingsPage(el)}

function quickNew(){
  if(current==='vgp'){
    const t=db.vgpTypes[0];
    openReportForm(null,t?.key);
  } else if(current==='chemical') openChemicalForm();
  else importJSON();
}

function allTypes(){return db.vgpTypes}
function vgpType(key){return allTypes().find(x=>x.key===key)||{key,code:key,name:key,icon:'⚙',desc:'',periodicityMonths:12,alertDays:30}}
function reportsForType(key){return db.vgpReports.filter(r=>(r.vgpKey||r.reportType)===key)}
function equipmentForType(key){return db.vgpEquipment.filter(e=>e.vgpKey===key)}
function findingsForReport(reportId){return db.vgpFindings.filter(f=>f.reportId===reportId)}
function findingStatus(f){
  if(f.status==='Clôturée'||f.status==='Annulée')return f.status;
  if(f.due && f.due<now())return 'Délai dépassé';
  return f.status||'À traiter'
}
function dueState(date,alertDays=30){
  if(!date)return {key:'none',label:'Non renseignée',className:'muted'};
  if(date<now())return {key:'late',label:'Échéance dépassée',className:'overdue'};
  const soon=addMonths(now,0);
  const lim=new Date();lim.setDate(lim.getDate()+Number(alertDays||30));
  if(new Date(date+'T00:00:00')<=lim)return {key:'soon',label:'Échéance proche',className:'soon'};
  return {key:'ok',label:'À jour',className:'ok'}
}
function reportNext(t,inspection){return inspection?addMonths(inspection,t.periodicityMonths):''}
function reportYear(r){return String(r.inspection||r.created||now()).slice(0,4)}
function vgpStats(){
  const f=db.vgpFindings;
  const open=f.filter(x=>!['Clôturée','Annulée'].includes(findingStatus(x))).length;
  const closed=f.filter(x=>findingStatus(x)==='Clôturée').length;
  const overdue=f.filter(x=>findingStatus(x)==='Délai dépassé').length;
  const reports=db.vgpReports.length;
  const equipments=db.vgpEquipment.length;
  const dueSoon=db.vgpEquipment.filter(e=>dueState(e.nextDue,vgpType(e.vgpKey).alertDays).key==='soon').length;
  const dueLate=db.vgpEquipment.filter(e=>dueState(e.nextDue,vgpType(e.vgpKey).alertDays).key==='late').length;
  return {open,closed,overdue,reports,equipments,dueSoon,dueLate,totalFindings:f.length}
}
function vgpCompletion(reportId){
  const f=findingsForReport(reportId);
  if(!f.length)return 100;
  const done=f.filter(x=>findingStatus(x)==='Clôturée').length;
  return Math.round(done/f.length*100);
}

function setupDropzone(reportId){

- observation_number : numéro de l'observation dans le rapport si présent
- novelty : "Nouvelle observation" ou "Ancienne observation" (récurrente / déjà signalée / non levée lors d'un contrôle précédent). Déduis-le des mentions, légendes, couleurs décrites, colonnes "précédent / N-1", pastilles ou symboles du rapport. Si le rapport ne permet pas de le savoir, laisse "".
- location : ZONE = bâtiment, atelier, local, quai, étage, armoire, ligne, ou chemin d'emplacement complet
- equipment : matériel précis (n° de série / repère / désignation / tableau / circuit / porte / chariot...)
- finding : RAISON de la non-conformité, claire et courte (ce qui ne va pas et, si indiqué, pourquoi c'est un risque)
- action : ACTION CORRECTIVE demandée ou logiquement déduite de la préconisation du rapport
- priority : "Critique" (danger immédiat : masse sous tension accessible, point chaud critique, limiteur / frein / arrêt d'urgence HS, zone ATEX non conforme, absence totale de protection), "Haute" (risque grave : choc électrique, échauffement critique, défaut de sécurité de levage, protection insuffisante...), "Normale", ou "Basse" (amélioration, documentation, repérage). Utilise l'indication de criticité du rapport si elle existe.
- evidence : citation courte du rapport

Règles absolues :
1. Parcours TOUTES les pages fournies. Aucune limite de nombre.
2. Une observation distincte = une ligne. Ne fusionne pas deux équipements ou lieux parce que l'action est identique.
3. Une référence réglementaire (NF C15-100, R.4226-..., EN..., arrêté...) n'est jamais une non-conformité à elle seule et ne doit pas apparaître dans finding ni action.
4. Ignore : sommaire, pages de garde, méthodologie, rappels réglementaires, points conformes, "sans objet", éléments non évalués sans action, exemples pédagogiques.
5. Thermographie : un point chaud / écart de température / échauffement anormal est une NC ; indique l'écart ou la température si le rapport la donne.
6. Levage / chariots / portes : les défauts de sécurité (limiteurs, câbles, crochets, freins, fourches, mât, cellules, bords sensibles, signalisation) sont des NC même si formulés comme "à remplacer" ou "à réparer".
7. L'ACTION ne contient ni nom d'entreprise, ni localisation, ni référence réglementaire, ni début du constat suivant. Si le rapport donne une préconisation, reprends-la ; sinon formule une action corrective concrète et prudente.
8. Si un texte est ambigu, ne l'invente pas : laisse le champ vide.

Réponse JSON uniquement :
{"findings":[{"page":2,"observation_number":"4","novelty":"Nouvelle observation","location":"Bâtiment A — Logistique — Stockage","equipment":"Armoire TGBT","finding":"Absence de protection contre les surcharges sur le circuit","action":"Installer un dispositif de protection adapté à l’intensité admissible du circuit","priority":"Haute","evidence":"Absence de protection de surcharges sur le(s) circuit(s)."}],"pages_covered":[2,3,4,5],"notes":""}`}
function aiOrientationPrompt(reportFamily,firstPages){return `Tu dois d'abord comprendre la structure de ce rapport ${reportFamily||'VGP'} avant d'en extraire les non-conformités. Identifie uniquement : 1) comment le rapport désigne une observation/anomalie, 2) où se trouvent les actions/préconisations, 3) comment sont indiqués les éléments nouveaux/récurrents si une légende existe, 4) comment les colonnes/lieux/équipements sont organisés. Ne produis pas encore de NC. Réponds en JSON : {"report_family":"...","observation_pattern":"...","action_pattern":"...","novelty_rule":"...","layout_notes":"..."}. Pages :\n\n${firstPages}`}
function aiChunkPrompt(orientation,chunk,expectedRange){return `CONTEXTE DE STRUCTURE DU RAPPORT : ${JSON.stringify(orientation)}\n\nAnalyse intégralement les pages ${expectedRange}. Cherche toutes les observations/actionnables sur ces pages, y compris si une observation commence sur une page et se termine sur la suivante. Utilise le numéro de page fourni dans le texte.\n\n${chunk}`}
function aiConsolidationPrompt(orientation,candidates,baselineCount){return `Tu es le contrôleur qualité final d'une extraction de rapport VGP. Voici la règle de structure comprise du document : ${JSON.stringify(orientation)}\nLa pré-analyse indépendante a détecté ${baselineCount} élément(s) structuré(s). Ce nombre est seulement un contrôle, pas une limite.\n\nLes candidats IA proviennent de blocs de pages avec chevauchement. Tu dois :\n- conserver toute observation réellement distincte ;\n- fusionner uniquement un doublon évident issu du chevauchement des pages ;\n- ne jamais fusionner deux observations différentes parce qu'elles ont la même action ;\n- compléter/corriger lieu, équipement, constat, action, numéro et nouveauté lorsque le document le permet ;\n- supprimer seulement les faux positifs manifestes (référence réglementaire seule, exemple, page de garde, sommaire, contrôle conforme, sans objet sans action) ;\n- restituer la liste complète, sans plafond de quantité.\n\nRetour JSON uniquement : {"findings":[...],"total":N,"quality_notes":"..."}\n\nCANDIDATS :\n${JSON.stringify(candidates)}`}
async function fetchWithTimeout(url,options,ms){const controller=new AbortController();const t=setTimeout(()=>controller.abort(),ms);try{return await fetch(url,{...options,signal:controller.signal})}catch(e){if(e?.name==='AbortError')throw new Error(`Délai dépassé (${Math.round(ms/1000)} s)`);throw e}finally{clearTimeout(t)}}

  const cfg=aiSettingsSafe();const endpoint=String(opts.endpoint||cfg.endpoint||'').trim(),model=String(opts.model||cfg.model||'').trim();if(!endpoint||!model)throw new Error('Endpoint ou modèle IA manquant.');

  if(provider==='gemini'){
    url=endpoint.replace(/\/+$/,'').replace(/\/models\/.*$/,'')+`/models/${encodeURIComponent(model)}:generateContent`;
    body={systemInstruction:{parts:[{text:aiSystemPrompt()}]},contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:0,maxOutputTokens:16384,...(opts.plain?{}:{responseMimeType:'application/json'})}};
  }
  else if(provider==='ollama')body={model,messages:[{role:'system',content:aiSystemPrompt()},{role:'user',content:prompt}],stream:false,options:{temperature:0}};
  else if(provider==='responses')body={model,input:[{role:'system',content:aiSystemPrompt()},{role:'user',content:prompt}]};
  else body={model,messages:[{role:'system',content:aiSystemPrompt()},{role:'user',content:prompt}],temperature:0,stream:false};
  const res=await fetchWithTimeout(url,{method:'POST',headers,body:JSON.stringify(body)},Number(cfg.timeout)||90000);let data=null;let textBody='';try{data=await res.json()}catch{try{textBody=await res.text()}catch{}}
  if(!res.ok){const msg=data?.error?.message||data?.error||textBody||`HTTP ${res.status}`;throw new Error(String(msg).slice(0,500))}
  return data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||data?.choices?.[0]?.message?.content||data?.message?.content||data?.response||data?.output_text||data?.output?.flatMap?.(x=>x.content||[]).map?.(x=>x.text||'').join?.('')||'';
}

async function analyzeWithAiEngine(reportId){

  try{
    const family=detectReportFamily(r.ai.rawText,r);r.ai.reportFamily=family;
    const first=r.ai.pageTexts.slice(0,Math.min(8,r.ai.pageTexts.length)).map((t,i)=>`--- PAGE ${i+1} ---\n${String(t).slice(0,9000)}`).join('\n\n');
    let orientation={report_family:family,observation_pattern:'à déterminer',action_pattern:'à déterminer',novelty_rule:'',layout_notes:''};
    try{const orientReply=await callAiEndpointV2(aiOrientationPrompt(family,first));const orientJson=extractJsonObject(orientReply);if(orientJson&&typeof orientJson==='object')orientation={...orientation,...orientJson}}catch(e){r.ai.orientationWarning=e.message||String(e)}
    r.ai.orientation=orientation;
    const chunks=splitAiDocument(r.ai.pageTexts,Math.max(3,Math.min(8,Number(cfg.chunkPages)||5)),1),all=[];
    for(let i=0;i<chunks.length;i++){
      const c=chunks[i];r.ai.status=`Lecture IA du rapport : bloc ${i+1}/${chunks.length} — pages ${c.start+1} à ${c.end}`;saveDB();render();
      const reply=await callAiEndpointV2(aiChunkPrompt(orientation,c.text,`${c.start+1} à ${c.end}`));const found=parseAiFindings(reply);for(const f of found)all.push({...f,chunkIndex:i,origin:'ai'});
    }

    r.ai.status=`Vérification croisée de ${cleaned.length} proposition(s)…`;saveDB();render();
    let final=cleaned;
    if(cleaned.length){
      const compact=cleaned.map((x,i)=>({id:i,page:x.page,observation_number:x.reportObservationNo||'',novelty:x.observationKind||'',location:x.location||'',equipment:x.equipment||'',finding:x.description||x.title||'',action:x.action||'',evidence:x.sourceQuote||''}));

    }
    const structured=extractVgpObservationSummary(r.ai.rawText,r.ai.pageTexts||[],r.ai.observationMarkers||{}).candidates.map(x=>({...x,origin:'structured'}));
    r.ai.structuredCount=structured.length;r.ai.candidates=mergeAiAndStructured(structured,final);r.ai.aiCount=final.length;r.ai.status=`Analyse IA terminée : ${r.ai.candidates.length} proposition(s). IA : ${final.length}. Vérification structurée : ${structured.length}.`;r.ai.aiFinishedAt=new Date().toISOString();saveDB();toast(`Analyse IA terminée : ${r.ai.candidates.length} proposition(s).`);
  }finally{aiBusy=false;saveDB();render()}
}
function dedupeAiCandidates(items){

function mergeAiAndStructured(structured,aiFound){
  const out=[];const usedAi=new Set();
  for(const b0 of structured||[]){const b=normalizeFindingForApp({...b0,id:uid('AIC'),origin:'structured'});let best=-1,score=0;for(let i=0;i<(aiFound||[]).length;i++){if(usedAi.has(i))continue;const a=aiFound[i];const obs=b.reportObservationNo&&a.reportObservationNo&&String(b.reportObservationNo)===String(a.reportObservationNo)?1:0;const page=String(b.page||'')===String(a.page||'')?.25:0;const loc=similarity(b.location,a.location)*.2;const core=similarity((b.description||'')+' '+(b.action||''),(a.description||'')+' '+(a.action||''))*.55;const sc=obs*.7+page+loc+core;if(sc>score){best=i;score=sc}}if(best>=0&&score>=.6){const a=aiFound[best];usedAi.add(best);out.push(normalizeFindingForApp({...b,description:a.description||b.description,action:a.action||b.action,location:a.location||b.location,equipment:a.equipment||b.equipment,observationKind:a.observationKind||b.observationKind,sourceQuote:a.sourceQuote||b.sourceQuote,confidence:Math.max(Number(a.confidence||0),Number(b.confidence||0)),origin:'ai-review'}))}else{const core=x=>(x.description||'')+' '+(x.action||'')+' '+(x.equipment||'');const coveredByAi=(aiFound||[]).some(a=>similarity(core(b),core(a))>=.3);if(!coveredByAi)out.push(b)}}
  for(let i=0;i<(aiFound||[]).length;i++)if(!usedAi.has(i))out.push(normalizeFindingForApp({...aiFound[i],origin:'ai-added'}));
  return out;
}

  download('inventaire_risque_chimique.csv',rows.map(r=>r.map(csvCell).join(';')).join('\\n'),'text/csv;charset=utf-8');

function settingsPage(el){
  const cfg=aiSettingsSafe();
  el.innerHTML=`<div class="pagehead"><div><h1>Paramètres & données</h1><div class="muted">Sauvegarde, restauration, IA et référentiels.</div></div></div>
  <div class="grid two">
   <div class="card"><h2>Sauvegarde</h2><div class="help">Toutes les données sont stockées dans le navigateur. Fais régulièrement un export JSON avant toute modification importante.</div><div class="form-actions" style="justify-content:flex-start"><button class="btn primary" onclick="exportJSON()">⇩ Exporter toutes les données</button><button class="btn" onclick="importJSON()">⇧ Importer JSON</button></div></div>
   <div class="card"><h2>IA — lecture intelligente des rapports VGP</h2>
    <div class="help">L’IA est maintenant le moteur principal de lecture. Elle analyse les pages du PDF, comprend sa structure puis recherche les observations, même lorsque le rapport n’est pas construit comme un Q18.</div>
    <div class="field" style="margin-top:12px"><label class="checkbox-label"><input id="aiEnabled" type="checkbox" ${cfg.enabled?'checked':''} onchange="toggleAiExternal(this.checked)"> Activer l’analyse IA</label></div>
    <div class="field"><label for="aiProvider">Moteur</label><select id="aiProvider" onchange="aiProviderChanged(this.value)"><option value="gemini" ${cfg.provider==='gemini'?'selected':''}>Google Gemini (recommandé)</option><option value="ollama" ${cfg.provider==='ollama'?'selected':''}>Ollama local</option><option value="openai-compatible" ${cfg.provider==='openai-compatible'?'selected':''}>API compatible OpenAI / Chat</option><option value="responses" ${cfg.provider==='responses'?'selected':''}>OpenAI Responses / passerelle compatible</option></select></div>
    <div class="field"><label for="aiEndpoint">Endpoint IA</label><input id="aiEndpoint" value="${esc(cfg.endpoint)}" placeholder="http://127.0.0.1:11434/api/chat"></div>
    <div class="field"><label for="aiModel">Modèle</label><input id="aiModel" value="${esc(cfg.model)}" placeholder="Nom exact du modèle installé / fourni par le serveur"></div>
    <div class="field"><label for="aiApiKey">Clé API <span class="muted">(facultative, jamais exportée)</span></label><input id="aiApiKey" type="password" value="${esc(cfg.apiKey||'')}" placeholder="Utilisée uniquement pour la session en cours"></div>
    <div class="formgrid"><div class="field"><label>Pages par bloc IA</label><select id="aiChunkPages"><option value="4" ${cfg.chunkPages===4?'selected':''}>4</option><option value="5" ${cfg.chunkPages===5?'selected':''}>5</option><option value="6" ${cfg.chunkPages===6?'selected':''}>6</option><option value="8" ${cfg.chunkPages===8?'selected':''}>8</option></select></div><div class="field"><label>Délai maximum / appel</label><select id="aiTimeout"><option value="60000" ${cfg.timeout===60000?'selected':''}>60 s</option><option value="90000" ${cfg.timeout===90000?'selected':''}>90 s</option><option value="120000" ${cfg.timeout===120000?'selected':''}>120 s</option></select></div></div>
    <div class="form-actions" style="justify-content:flex-start"><button class="btn primary" onclick="saveAiSettings()">Enregistrer l’IA</button><button class="btn" onclick="testAiV2()">Tester la connexion IA</button></div>
    <div id="aiDiagnostic" class="ai-diag">${cfg.enabled?'IA activée. Lance le test pour vérifier réellement la connexion.':'IA désactivée.'}</div>
    <div class="help" style="margin-top:8px">Pour Gemini : colle ta clé (aistudio.google.com/apikey), elle reste uniquement en session (jamais exportée). Pour Ollama : modèle installé localement + serveur Ollama démarré. Depuis un fichier HTML ouvert directement, l’autorisation navigateur/CORS du serveur local est nécessaire. Pour une application commercialisée, une passerelle serveur est préférable afin de ne jamais exposer une clé API dans le HTML.</div>
   </div>
  </div>
  <div class="grid two" style="margin-top:16px">
   <div class="card"><h2>Référentiel unités de travail</h2><div class="toolbar"><input id="unitNew" placeholder="Nouvelle unité"><button class="btn" onclick="addUnit()">Ajouter</button></div><div class="stack">${db.workUnits.map(u=>`<span class="chip">${esc(u)} <button style="border:0;background:transparent;padding:0" onclick="removeUnit('${esc(u)}')">×</button></span>`).join('')||'<span class="muted">Aucune unité.</span>'}</div></div>

  </div>
  <div class="card" style="margin-top:16px"><h2>Réinitialisation</h2><div class="notice red">Cette action efface uniquement les données locales de cette application.</div><button class="btn danger" onclick="resetAll()">Effacer les données locales</button></div>`;

function aiProviderChanged(p){const ep=document.getElementById('aiEndpoint'),md=document.getElementById('aiModel');if(p==='gemini'){ep.value='https://generativelanguage.googleapis.com/v1beta';md.value='gemini-2.5-flash'}else if(p==='ollama'){ep.value='http://127.0.0.1:11434/api/chat';md.value='llama3.2'}}
window.aiProviderChanged=aiProviderChanged;
function toggleAiExternal(enabled){aiSettings={...aiSettings,enabled:Boolean(enabled)};db.aiSettings={enabled:aiSettings.enabled,provider:aiSettings.provider,endpoint:aiSettings.endpoint,model:aiSettings.model,timeout:aiSettings.timeout,chunkPages:aiSettings.chunkPages,visionFallback:aiSettings.visionFallback};saveDB();const el=document.getElementById('aiDiagnostic');if(el)el.textContent=aiSettings.enabled?'IA activée.':'IA désactivée.';toast(aiSettings.enabled?'IA activée.':'IA désactivée.');}
function saveAiSettings(preserveKey=true){
  try{
    const enabled=!!document.getElementById('aiEnabled')?.checked;const provider=String(document.getElementById('aiProvider')?.value||aiSettings.provider||'ollama');const endpoint=String(document.getElementById('aiEndpoint')?.value||'').trim();const model=String(document.getElementById('aiModel')?.value||'').trim();const apiKey=String(document.getElementById('aiApiKey')?.value||'').trim();const chunkPages=Number(document.getElementById('aiChunkPages')?.value||5);const timeout=Number(document.getElementById('aiTimeout')?.value||90000);
    aiSettings={...aiSettings,enabled,provider,endpoint,model,chunkPages,timeout,apiKey};db.aiSettings={enabled,provider,endpoint,model,timeout,chunkPages,visionFallback:Boolean(aiSettings.visionFallback)};saveDB();sessionStorage.setItem('sgeAiSessionKey',preserveKey?apiKey:'');showAiDiagnostic('ok','Configuration IA enregistrée dans l’application. La clé API reste uniquement dans la session.');toast('Configuration IA enregistrée.');
  }catch(e){console.error(e);showAiDiagnostic('err','Impossible d’enregistrer la configuration IA.')}
}
function loadAiSettings(){try{const src=db?.aiSettings||JSON.parse(localStorage.getItem('sgeAiSettings')||'null')||{};aiSettings={...aiDefaultSettings(),...src,apiKey:sessionStorage.getItem('sgeAiSessionKey')||''}}catch(e){console.warn('Chargement configuration IA impossible',e);aiSettings=aiDefaultSettings()}}
async function testAi(){return testAiV2()}

function addUnit(){const v=document.getElementById('unitNew').value.trim();if(v&&!db.workUnits.includes(v)){db.workUnits.push(v);saveDB();render()}}
function removeUnit(v){db.workUnits=db.workUnits.filter(x=>x!==v);saveDB();render()}
function addPerson(){const v=document.getElementById('personNew').value.trim();if(v&&!db.personnel.includes(v)){db.personnel.push(v);saveDB();render()}}
function removePerson(v){db.personnel=db.personnel.filter(x=>x!==v);saveDB();render()}
function resetAll(){if(!confirm('Effacer toutes les données locales ?'))return;localStorage.removeItem('sgeHseVgpChemicalDB');db=loadDB();render();toast('Données effacées.')}

function exportJSON(){download('sge_hse_vgp_chimique_backup.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),db},null,2),'application/json;charset=utf-8')}
function importJSON(){
  const i=document.createElement('input');i.type='file';i.accept='application/json,.json';i.onchange=async()=>{const f=i.files?.[0];if(!f)return;try{const x=JSON.parse(await f.text());const src=x.db||x;db={...db,...src};saveDB();render();toast('Sauvegarde importée.')}catch(e){alert('Fichier JSON invalide : '+e.message)}};i.click();
}

function showModal(inner){document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${inner}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}

function migrateV7StoredData(){for(const f of(db.vgpFindings||[])){Object.assign(f,normalizeFindingForApp(f));if(f.reportObservationNo)f.title=observationLabel(f.reportObservationNo,f.observationKind)}for(const r of(db.vgpReports||[]))if(r.ai?.candidates)r.ai.candidates=r.ai.candidates.map(normalizeFindingForApp);saveDB()}
loadAiSettings(); migrateV7StoredData(); nav();render();

window.go=go;window.toggleMenu=toggleMenu;window.render=render;window.quickNew=quickNew;window.backVgpHome=backVgpHome;window.openVgpType=openVgpType;window.openVgpPlan=openVgpPlan;window.openGlobalPlan=openGlobalPlan;window.openReport=openReport;window.openReportForm=openReportForm;window.deleteReport=deleteReport;window.openFindingForm=openFindingForm;window.deleteFinding=deleteFinding;window.openEquipmentForm=openEquipmentForm;window.deleteEquipment=deleteEquipment;window.openVgpTypeForm=openVgpTypeForm;window.deleteVgpType=deleteVgpType;window.exportVgpPlan=exportVgpPlan;window.handlePdfInput=handlePdfInput;window.startAiAnalysis=startAiAnalysis;window.acceptAiCandidate=acceptAiCandidate;window.editAiCandidate=editAiCandidate;window.closeModal=closeModal;window.filterPlan=filterPlan;
window.quickImportPdf=quickImportPdf;window.runCompleteAi=runCompleteAi;window.reviewWithAi=reviewWithAi;window.acceptAllAiCandidates=acceptAllAiCandidates;window.openChemicalForm=openChemicalForm;window.openChemicalDetail=openChemicalDetail;window.openChemicalRequestForm=openChemicalRequestForm;window.openChemicalActionForm=openChemicalActionForm;window.filterChem=filterChem;window.saveChemicalSettings=saveChemicalSettings;window.exportChemicalCSV=exportChemicalCSV;window.saveAiSettings=saveAiSettings;window.toggleAiExternal=toggleAiExternal;window.testAi=testAi;window.testAiV2=testAiV2;window.showAiDiagnostic=showAiDiagnostic;window.analyzeWithAiEngine=analyzeWithAiEngine;window.addUnit=addUnit;window.removeUnit=removeUnit;window.addPerson=addPerson;window.removePerson=removePerson;window.resetAll=resetAll;window.exportJSON=exportJSON;window.importJSON=importJSON;window.addUnitInline=addUnitInline;
